apiVersion: apps/v1
kind: Deployment
metadata:
  name: podiumd-proxy
  namespace: default
  labels:
    app: podiumd-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podiumd-proxy
  template:
    metadata:
      labels:
        app: podiumd-proxy
    spec:
      containers:
        - name: podiumd-proxy
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: podiumd-proxy-conf
