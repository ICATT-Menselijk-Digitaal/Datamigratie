apiVersion: v1
kind: ConfigMap
metadata:
  name: podiumd-proxy-conf
  namespace: default
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location / {
          proxy_pass https://dontwikkelmidoffice.dimpact.nl;
          proxy_set_header Host dontwikkelmidoffice.dimpact.nl;
          proxy_ssl_server_name on;
          proxy_set_header X-Forwarded-For "";
          proxy_set_header X-Forwarded-Host "";
          proxy_set_header X-Forwarded-Proto "";
          proxy_set_header X-Real-IP "";
          proxy_set_header X-Scheme "";
          proxy_set_header X-Forwarded-Scheme "";
        }
      }
    }
